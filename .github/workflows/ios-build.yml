name: iOS Build & TestFlight Deploy (CI/CD)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy iOS App to TestFlight
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Import Signing Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_P12_PASSWORD }}

      - name: Install Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > /tmp/profile.mobileprovision
          
          PROFILE_UUID=$(security cms -D -i /tmp/profile.mobileprovision | plutil -extract UUID raw -)
          PROFILE_NAME=$(security cms -D -i /tmp/profile.mobileprovision | plutil -extract Name raw -)
          
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
          
          echo "Extracted Profile Name: $PROFILE_NAME"
          echo "Extracted Profile UUID: $PROFILE_UUID"
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV

      - name: Extract Team ID from Provisioning Profile
        run: |
          TEAM_ID=$(security cms -D -i /tmp/profile.mobileprovision | plutil -extract TeamIdentifier.0 raw -)
          echo "Extracted Team ID: $TEAM_ID"
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV

      - name: Save App Store Connect API Key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.private_keys
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH=~/.private_keys/AuthKey_${KEY_ID}.p8
          
          if [[ "$APP_STORE_CONNECT_PRIVATE_KEY" == *"BEGIN"* ]]; then
            printf "%s\n" "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_PATH"
          else
            echo "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode > "$KEY_PATH"
          fi
          
          cp "$KEY_PATH" ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 "$KEY_PATH" ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          
          echo "Key file created at $KEY_PATH, size: $(wc -c < "$KEY_PATH") bytes"

      - name: Create local.properties
        run: |
          touch local.properties
          touch composeApp/local.properties

      - name: Build Kotlin Multiplatform Framework
        run: ./gradlew :composeApp:assembleRelease

      - name: Create ExportOptions.plist
        run: |
          cat <<EOF | sed 's/^[ \t]*//' > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${{ env.TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.example.pxrioverde</key>
                  <string>${{ env.PROFILE_NAME }}</string>
              </dict>
              <key>uploadSymbols</key>
              <true/>
              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          EOF
          plutil -lint ExportOptions.plist

      - name: Archive iOS App
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
                     -scheme iosApp \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath build/iosApp.xcarchive \
                     archive \
                     DEVELOPMENT_TEAM=${{ env.TEAM_ID }} \
                     CODE_SIGN_STYLE=Manual \
                     CODE_SIGN_IDENTITY="Apple Distribution" \
                     PROVISIONING_PROFILE_SPECIFIER="${{ env.PROFILE_NAME }}"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
                     -archivePath build/iosApp.xcarchive \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath build/output

      - name: Upload to TestFlight / App Store Connect
        run: |
          xcrun altool --upload-app \
            -f build/output/*.ipa \
            -t ios \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            --verbose

      - name: Upload IPA Artifact to GitHub Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-release
          path: build/output/*.ipa
